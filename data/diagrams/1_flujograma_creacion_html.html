<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Flujo · Creación del Análisis Semanal (HTML)</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D1A;
      --card: #161626;
      --border: rgba(255, 255, 255, 0.12);
      --ink: #FFFFFF;
      --muted: #9AA4B2;
      --mint: #53C1AB;
      --cyan: #3E91AF;
      --gold: #D4AF37;
      --coral: #E76F51;
      --font-main: 'Space Grotesk', sans-serif;
      --font-title: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    p.desc {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      max-width: 800px;
      line-height: 1.4;
    }

    .svg-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    svg {
      width: 100%;
      min-width: 880px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Diagrama de Flujo 1 · Arquitectura Semanal</p>
    <h1>Flujograma: Creación del Informe Semanal HTML & Análisis Técnico</h1>
    <p class="desc">Decisiones y etapas algorítmicas ejecutadas cada lunes: desde la consulta de la foto en disco, la extracción en MT5, la modelación de escenarios hasta la compilación del HTML interactivo.</p>

    <div class="svg-container">
      <svg viewBox="0 0 920 1180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
          </pattern>
          <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#9AA4B2"/>
          </marker>
          <marker id="arr-mint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#53C1AB"/>
          </marker>
          <marker id="arr-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#E76F51"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#161626" rx="12"/>
        <rect width="100%" height="100%" fill="url(#dots)" rx="12"/>

        <!-- CONECTORES / FLECHAS (Detrás de los nodos) -->
        <!-- 1. Start -> Decisión 1 -->
        <line x1="460" y1="65" x2="460" y2="105" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Decisión 1: SÍ -> derecha (Reuso) -->
        <line x1="560" y1="150" x2="720" y2="150" stroke="#53C1AB" stroke-width="1.8" marker-end="url(#arr-mint)"/>
        <line x1="720" y1="185" x2="720" y2="245" stroke="#53C1AB" stroke-width="1.8" marker-end="url(#arr-mint)"/>

        <!-- Decisión 1: NO -> abajo (Extracción) -->
        <line x1="460" y1="195" x2="460" y2="240" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Extracción -> Análisis Técnico -->
        <line x1="460" y1="300" x2="460" y2="340" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Análisis -> Decisión 2 (Setup claro) -->
        <line x1="460" y1="400" x2="460" y2="445" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Decisión 2: NO -> derecha (Sin simulación) -->
        <line x1="560" y1="490" x2="710" y2="490" stroke="#E76F51" stroke-width="1.8" marker-end="url(#arr-coral)"/>

        <!-- Decisión 2: SÍ -> abajo (Fijar niveles) -->
        <line x1="460" y1="535" x2="460" y2="580" stroke="#53C1AB" stroke-width="1.8" marker-end="url(#arr-mint)"/>

        <!-- Sin simulación -> une abajo a Render Gráficos -->
        <line x1="710" y1="525" x2="710" y2="675" stroke="#9AA4B2" stroke-width="1.8"/>
        <line x1="710" y1="675" x2="575" y2="675" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Fijar niveles -> Render Gráficos -->
        <line x1="460" y1="635" x2="460" y2="655" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Render Gráficos -> Redacción Editorial (agy) -->
        <line x1="460" y1="715" x2="460" y2="755" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Redacción -> Compilación HTML -->
        <line x1="460" y1="815" x2="460" y2="855" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Compilación -> Guardar en Registro -->
        <line x1="460" y1="915" x2="460" y2="955" stroke="#9AA4B2" stroke-width="1.8" marker-end="url(#arr)"/>

        <!-- Guardar -> Fin -->
        <line x1="460" y1="1015" x2="460" y2="1055" stroke="#53C1AB" stroke-width="2" marker-end="url(#arr-mint)"/>

        <!-- Reuso -> Fin -->
        <line x1="720" y1="305" x2="720" y2="1080" stroke="#53C1AB" stroke-width="1.8"/>
        <line x1="720" y1="1080" x2="555" y2="1080" stroke="#53C1AB" stroke-width="1.8" marker-end="url(#arr-mint)"/>

        <!-- MÁSCARAS DE TEXTO SOBRE FLECHAS (Labels) -->
        <!-- Label D1 SÍ -->
        <rect x="615" y="142" width="28" height="16" rx="3" fill="#161626"/>
        <text x="629" y="154" fill="#53C1AB" font-family="'JetBrains Mono'" font-size="10" font-weight="700" text-anchor="middle">SÍ</text>

        <!-- Label D1 NO -->
        <rect x="446" y="208" width="28" height="16" rx="3" fill="#161626"/>
        <text x="460" y="220" fill="#9AA4B2" font-family="'JetBrains Mono'" font-size="10" font-weight="700" text-anchor="middle">NO</text>

        <!-- Label D2 NO -->
        <rect x="615" y="482" width="28" height="16" rx="3" fill="#161626"/>
        <text x="629" y="494" fill="#E76F51" font-family="'JetBrains Mono'" font-size="10" font-weight="700" text-anchor="middle">NO</text>

        <!-- Label D2 SÍ -->
        <rect x="446" y="548" width="28" height="16" rx="3" fill="#161626"/>
        <text x="460" y="560" fill="#53C1AB" font-family="'JetBrains Mono'" font-size="10" font-weight="700" text-anchor="middle">SÍ</text>


        <!-- NODOS DEL DIAGRAMA -->

        <!-- NODO 1: INICIO (Óvalo) -->
        <rect x="370" y="25" width="180" height="40" rx="20" fill="#0D0D1A" stroke="#53C1AB" stroke-width="2"/>
        <text x="460" y="49" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="13" font-weight="700" text-anchor="middle">INICIO: Pedido /oportunidad</text>

        <!-- NODO 2: DECISIÓN 1 (Rombo) -->
        <polygon points="460,105 560,150 460,195 360,150" fill="#0D0D1A" stroke="#3E91AF" stroke-width="1.8"/>
        <text x="460" y="145" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="11.5" font-weight="600" text-anchor="middle">¿Existe foto semanal</text>
        <text x="460" y="160" fill="#3E91AF" font-family="'JetBrains Mono'" font-size="10.5" text-anchor="middle">en data/semanal/?</text>

        <!-- NODO RAMA SÍ: Reuso (Rectángulo) -->
        <rect x="635" y="245" width="170" height="60" rx="8" fill="#0D0D1A" stroke="#53C1AB" stroke-width="1.6"/>
        <text x="720" y="270" fill="#53C1AB" font-family="'Space Grotesk'" font-size="12" font-weight="700" text-anchor="middle">Reutilizar Foto Existente</text>
        <text x="720" y="288" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11" text-anchor="middle">Costo 0 cómputo / agy</text>

        <!-- NODO 3: Extracción (Rectángulo) -->
        <rect x="345" y="240" width="230" height="60" rx="8" fill="#0D0D1A" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="460" y="265" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="13" font-weight="700" text-anchor="middle">Extracción de Datos Crudos</text>
        <text x="460" y="284" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11.5" text-anchor="middle">MT5 (OHLC H4/D1) + Curvas Macro</text>

        <!-- NODO 4: Análisis Cuantitativo (Rectángulo) -->
        <rect x="330" y="340" width="260" height="60" rx="8" fill="#0D0D1A" stroke="#53C1AB" stroke-width="1.8"/>
        <text x="460" y="365" fill="#53C1AB" font-family="'Space Grotesk'" font-size="13" font-weight="700" text-anchor="middle">Motor Técnico Cuantitativo</text>
        <text x="460" y="384" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11.5" text-anchor="middle">Fractales swing + ATR H4 + Confluencias</text>

        <!-- NODO 5: DECISIÓN 2 (Rombo) -->
        <polygon points="460,445 560,490 460,535 360,490" fill="#0D0D1A" stroke="#D4AF37" stroke-width="1.8"/>
        <text x="460" y="485" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="11.5" font-weight="600" text-anchor="middle">¿Activo con setup claro?</text>
        <text x="460" y="500" fill="#D4AF37" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">(Rango / Quiebre / Retesteo)</text>

        <!-- NODO RAMA NO: Sin Simulación (Rectángulo) -->
        <rect x="625" y="465" width="170" height="60" rx="8" fill="#0D0D1A" stroke="#E76F51" stroke-width="1.5"/>
        <text x="710" y="490" fill="#E76F51" font-family="'Space Grotesk'" font-size="12" font-weight="700" text-anchor="middle">Motivo Sin Simulación</text>
        <text x="710" y="508" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11" text-anchor="middle">Va al informe con causa clara</text>

        <!-- NODO 6: Fijar Niveles (Rectángulo) -->
        <rect x="340" y="580" width="240" height="55" rx="8" fill="#0D0D1A" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="460" y="604" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="12.5" font-weight="700" text-anchor="middle">Fijar Entrada, Stop y Objetivo</text>
        <text x="460" y="622" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11" text-anchor="middle">Respetando tabla de decimales (digits)</text>

        <!-- NODO 7: Render Gráficos (Rectángulo) -->
        <rect x="345" y="655" width="230" height="60" rx="8" fill="#0D0D1A" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="460" y="680" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="13" font-weight="700" text-anchor="middle">Renderizado de Gráficos</text>
        <text x="460" y="699" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11.5" text-anchor="middle">Matplotlib: velas H4 limpias sin ruido</text>

        <!-- NODO 8: Redacción Editorial (Rectángulo) -->
        <rect x="330" y="755" width="260" height="60" rx="8" fill="#0D0D1A" stroke="#3E91AF" stroke-width="1.8"/>
        <text x="460" y="780" fill="#3E91AF" font-family="'Space Grotesk'" font-size="13" font-weight="700" text-anchor="middle">Redacción Editorial (agy)</text>
        <text x="460" y="799" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11.5" text-anchor="middle">Titulares institucionales y síntesis en pieza.json</text>

        <!-- NODO 9: Compilación HTML (Rectángulo) -->
        <rect x="315" y="855" width="290" height="60" rx="8" fill="#0D0D1A" stroke="#53C1AB" stroke-width="2"/>
        <text x="460" y="880" fill="#53C1AB" font-family="'Space Grotesk'" font-size="13.5" font-weight="700" text-anchor="middle">Compilación: oportunidad_html.py</text>
        <text x="460" y="899" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="11" text-anchor="middle">HTML Interactivo + Simulador Lotes + Botón Correo</text>

        <!-- NODO 10: Guardar en Registro (Rectángulo) -->
        <rect x="330" y="955" width="260" height="60" rx="8" fill="#0D0D1A" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="460" y="980" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="12.5" font-weight="700" text-anchor="middle">Congelar Registro Semanal</text>
        <text x="460" y="998" fill="#9AA4B2" font-family="'Space Grotesk'" font-size="11" text-anchor="middle">data/semanal/registro.json (inmutable)</text>

        <!-- NODO 11: FIN (Óvalo) -->
        <rect x="365" y="1055" width="190" height="50" rx="25" fill="#0D0D1A" stroke="#53C1AB" stroke-width="2.5"/>
        <text x="460" y="1085" fill="#53C1AB" font-family="'Space Grotesk'" font-size="13.5" font-weight="800" text-anchor="middle">FIN: Entrega de HTML</text>

      </svg>
    </div>
  </div>
</body>
</html>
