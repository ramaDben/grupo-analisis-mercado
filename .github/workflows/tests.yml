name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  market-data-mcp:
    name: market-data MCP (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # La suite corre sin MT5 ni fastmcp: el stack pesado se sustituye por un
        # stub del framework en tests/conftest.py. Las otras tres si hacen
        # falta: bias_reader lee playbook_config.yaml con yaml, y la cadena
        # pipeline_ingesta -> extractor_usa llama a FRED con requests y lee su
        # API key con dotenv. Sin ellas esos modulos ni se importan.
        run: python -m pip install --upgrade pip pytest pandas pyyaml requests python-dotenv

      - name: Run market-data MCP tests
        run: python -m pytest tests -v
