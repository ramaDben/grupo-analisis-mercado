<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{titulo}}</title>
<style>{{fuentes}}</style>
<style>
  :root{--fondo:#0b1118;--tarjeta:#16202b;--texto-1:#ffffff;--texto-2:#d6dde6;--texto-3:#9aa4b2;--acento:#50C0A8;--sube:#2ecc71;--baja:#e74c3c;--linea:#26323f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto-1);font:500 15px/1.5 "Segoe UI",Arial,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:24px}
  .portada .chip{color:var(--acento);font-weight:700;letter-spacing:1.5px;font-size:13px}
  h1{font-size:30px;line-height:1.25;margin:8px 0}
  .activo{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:20px;margin:20px 0;display:grid;grid-template-columns:3fr 2fr;gap:20px}
  .activo header,.activo .acciones{grid-column:1/-1}
  .activo header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .activo h2{margin:0;font-size:22px}
  .activo h3{margin:0 0 10px;font-size:19px}
  .direccion{padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:1.5px;background:var(--linea)}
  .direccion.alcista{background:var(--sube);color:var(--fondo)}
  .direccion.bajista{background:var(--baja);color:var(--texto-1)}
  .analisis img{width:100%;border-radius:10px}
  table.niveles{width:100%;border-collapse:collapse;margin:8px 0}
  table.niveles th{text-align:left;color:var(--texto-3);font-weight:600;padding:5px 0}
  table.niveles td{text-align:right;font-weight:700;padding:5px 0}
  .escenarios{list-style:none;padding:0;margin:8px 0}
  .escenarios li{padding:4px 0;color:var(--texto-2)}
  .temporalidad,.firma-analisis,.nota,.autor-sim{color:var(--texto-3);font-size:13px}
  .panel{background:var(--fondo);border-radius:12px;padding:16px;align-self:start}
  .panel h4{margin:0 0 6px;color:var(--acento)}
  .panel label{display:block;margin:10px 0}
  .panel input[type=number]{display:block;width:100%;height:40px;font-size:16px;margin-top:4px;padding:0 8px}
  .resultado{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .resultado .perdida,.resultado .ganancia{background:var(--tarjeta);border-radius:10px;padding:10px;min-height:70px}
  .resultado span{display:block;font-size:12px;color:var(--texto-3)}
  .resultado strong{display:block;font-size:20px}
  .resultado .perdida strong{color:var(--baja)}
  .resultado .ganancia strong{color:var(--sube)}
  .resultado p{grid-column:1/-1;margin:0;color:var(--texto-2)}
  button,a.descargar{background:var(--acento);color:var(--fondo);border:0;border-radius:8px;padding:10px 16px;font:700 14px "Segoe UI",Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;margin-right:8px}
  .correo{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:20px;margin:20px 0}
  .firma{display:flex;gap:16px;align-items:center;margin:20px 0}
  .firma img{max-height:80px}
  .firma p{margin:2px 0}
  .firma-credencial,.firma-general,.aviso{color:var(--texto-2);font-size:13px}
  .firma-foto{border-radius:50%}
  @media (max-width:800px){.activo{grid-template-columns:1fr}}
</style></head>
<body><main>
<header class="portada"><img src="{{logo}}" alt="Grupo Inteligencia" height="40">
  <p class="chip">ANÁLISIS TÉCNICO DE LA SEMANA · {{semana}} · {{edicion}}</p>
  <h1>{{titular}}</h1><p>{{bajada}}</p></header>
{{activos}}
<section class="correo"><h2>Correo para tu cliente</h2>
  <p>Marca los activos que quieres incluir y copia el correo: se pega en Outlook con el formato.</p>
  <button type="button" id="copiar-correo">Copiar correo para Outlook</button> <span id="estado"></span>
  <div id="vista-correo"></div></section>
{{correos}}
{{firma}}
<p class="aviso">{{aviso}}</p>
</main>
<script id="datos" type="application/json">{{datos}}</script>
<script id="simulador">{{simulador}}</script>
<script>
(function(){
  var DATOS = JSON.parse(document.getElementById('datos').textContent);
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function pesos(n){ return '$' + Math.round(n).toLocaleString('es-CL'); }
  function num(v){ var x = parseFloat(v); return isNaN(x) ? null : x; }
  function coma(n){ return String(n).replace('.', ','); }
  function estado(panel, d){
    var s = simular(d.contrato, d.escenario, num(panel.querySelector('[name=perdida]').value),
                    num(panel.querySelector('[name=capital]').value));
    var r = function(k){ return panel.querySelector('[data-r=' + k + ']'); };
    if (!s){ r('perdida').textContent = 'Escribe la pérdida aceptable'; r('ganancia').textContent = ''; r('volumen').textContent = ''; return null; }
    r('perdida').textContent = pesos(s.perdida) + (s.perdida_pct !== null ? ' (' + coma(s.perdida_pct) + ' %)' : '');
    r('ganancia').textContent = pesos(s.ganancia) + (s.ganancia_pct !== null ? ' (' + coma(s.ganancia_pct) + ' %)' : '');
    r('volumen').textContent = 'Volumen ' + coma(s.volumen) + (s.bajo_minimo ? ': es el mínimo, la pérdida no alcanza para menos' : '');
    return s;
  }
  function lineaSim(d, s){
    if (!s) return '';
    var f = d.fmt;
    var t = '🧮 Simulación de ' + DATOS.ejecutivo + ' (objetivo 1:3): con una pérdida aceptable de ' + pesos(s.perdida) +
            ', el volumen es ' + coma(s.volumen) + ' y el objetivo daría ' + pesos(s.ganancia) +
            '. Entrada ' + f.entrada + ' · Stop ' + f.stop + ' · Objetivo ' + f.objetivo + '.';
    if (s.bajo_minimo) t += ' La pérdida mínima con el volumen más chico es ' + pesos(s.perdida) + '.';
    return t;
  }
  var estadoEl = document.getElementById('estado');
  DATOS.activos.forEach(function(d){
    var sec = document.querySelector('.activo[data-ticker="' + d.ticker + '"]');
    var panel = sec.querySelector('.panel');
    var actual = null;
    if (panel && !d.motivo && d.contrato) panel.querySelectorAll('input[type=number]').forEach(function(i){
      i.addEventListener('input', function(){ actual = estado(panel, d); });
    });
    sec.querySelector('.copiar-wa').addEventListener('click', function(){
      var texto = d.whatsapp + (actual ? '\n' + lineaSim(d, actual) : '');
      navigator.clipboard.writeText(texto).then(function(){ estadoEl.textContent = 'Texto de WhatsApp copiado.'; });
    });
    d._sim = function(){ return actual; };
    d._marcado = function(){ var c = panel && panel.querySelector('[name=incluir]'); return !!(c && c.checked); };
  });

  // El correo: tablas de 640 px con estilos en línea y colores sólidos (Outlook clásico no
  // entiende rgba ni CSS externo). Se arma con los activos marcados y se copia como text/html.
  var FUENTE = "Segoe UI,Arial,Helvetica,sans-serif";
  function armarCorreo(){
    var partes = [];
    DATOS.activos.forEach(function(d){
      if (!d._marcado()) return;
      var t = document.querySelector('template.correo-activo[data-ticker="' + d.ticker + '"]');
      var cont = document.createElement('div');
      cont.innerHTML = t.innerHTML;
      var s = d._sim(), celda = cont.querySelector('.sim-correo');
      if (celda && d.motivo) celda.textContent = 'Sin simulación esta semana: ' + d.motivo;
      else if (celda) celda.textContent = s ? lineaSim(d, s) : '';
      if (celda && !s && !d.motivo) celda.parentNode.parentNode.removeChild(celda.parentNode);
      partes.push('<tr><td style="padding:0 0 16px 0">' + cont.innerHTML + '</td></tr>');
    });
    if (!partes.length) return null;
    var pie = '<tr><td style="padding:12px 24px;color:#d6dde6;font:500 14px/21px ' + FUENTE + '">' +
      esc(DATOS.autor) + '<br>' + esc(DATOS.aviso) + '</td></tr>' +
      '<tr><td style="padding:0 24px 18px;color:#ffffff;font:700 14px/21px ' + FUENTE + '">' +
      esc(DATOS.ejecutivo) + '<br><span style="font-weight:500;color:#9aa4b2">' + esc(DATOS.cargo) + ' · ' + esc(DATOS.contacto) + '</span></td></tr>';
    return '<table id="correo-root" role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b1118" style="width:640px;background:#0b1118;font-family:' + FUENTE + '">' +
      '<tr><td style="padding:18px 24px;color:#ffffff;font:700 22px/28px ' + FUENTE + '">' + esc(DATOS.titular) + '</td></tr>' +
      partes.join('') + pie + '</table>';
  }
  async function copiarCorreo(){
    var html = armarCorreo();
    if (!html){ estadoEl.textContent = 'Marca al menos un activo.'; return; }
    var vista = document.getElementById('vista-correo');
    vista.innerHTML = html;
    var root = document.getElementById('correo-root');
    try {
      if (!(navigator.clipboard && window.ClipboardItem)) throw 0;
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([root.outerHTML], {type: 'text/html'}),
        'text/plain': new Blob([root.innerText], {type: 'text/plain'})
      })]);
      estadoEl.textContent = 'Copiado. Pégalo en un correo nuevo de Outlook.';
    } catch (err) {
      var sel = window.getSelection(); sel.removeAllRanges();
      var r = document.createRange(); r.selectNode(root); sel.addRange(r);
      var ok = document.execCommand('copy'); sel.removeAllRanges();
      estadoEl.textContent = ok ? 'Copiado. Pégalo en un correo nuevo de Outlook.' : 'No se pudo copiar: selecciona el correo y cópialo a mano.';
    }
  }
  document.getElementById('copiar-correo').addEventListener('click', copiarCorreo);
})();
</script>
</body></html>
