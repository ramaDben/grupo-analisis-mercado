<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario Macro</title>
<style>
  /* ════ marca.css embebido ════ */
:root {

  --fondo:          #000000;
  --fondo-acento:   #0E2420;
  --fondo-alt:      #0A0A0F;
  --fondo-sube:     #123A2A;
  --fondo-baja:     #2A1220;

  --velo-inferior:  rgba(4, 18, 14, 0.95);

  --acento:         #50C0A8;
  --acento-azul:    #3C8CAA;
  --acento-oscuro:  #143028;

  --sube:           #00DC82;
  --sube-suave:     #53C1AB;
  --baja:           #E84040;
  --baja-suave:     #F5A3A3;
  --aviso:          #FFB020;

  --activo-oro:    #E8B44C;
  --activo-wti:    #E8783C;
  --activo-us100:  #4C86E8;
  --activo-usdclp: var(--acento);
  --activo-bitcoin:#F7931A;

  --activo-plata:  #C6CBD1;
  --activo-meli:   #F2C14E;
  --activo-tech-circuito: #4FB0C6;

  --activo-usdjpy: #B98A4A;
  --activo-eurusd: #6E7E96;
  --activo-gbpusd: #9E6B4A;
  --activo-us500:  #6BA3D8;
  --activo-us30:   #9C7B4E;
  --activo-iwm:    #8F9BA8;
  --activo-eth:    #7B7FE8;
  --activo-sol:    #C158D6;
  --activo-ltc:    #A8B2BF;
  --activo-ada:    #3B6FD4;
  --activo-doge:   #D9A22B;

  --font-display:   "Goldman", sans-serif;
  --font-titular:   "Goldman", sans-serif;
  --font-sans:      "Plus Jakarta Sans", "Segoe UI", "Noto Sans", Arial, sans-serif;
  --font-emoji:     "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji";
  --texto-1:        #F5F3F7;
  --texto-2:        #A9A5B4;
  --texto-3:        #6E6A7A;
  --texto-borde:    #C9C5D4;
  --texto-gris:     #8E8A9C;
  --blanco:         #FFFFFF;

  --filete:         var(--acento);
  --filete-ancho:   4px;
}

body {
  --direccion:        var(--acento);
  --direccion-suave:  var(--texto-borde);
  --fondo-direccion:  var(--fondo-acento);
}
body.sesgo-alcista, body.sesgo-compra {
  --direccion:        var(--sube);
  --direccion-suave:  var(--sube-suave);
  --fondo-direccion:  var(--fondo-sube);
}
body.sesgo-bajista, body.sesgo-venta {
  --direccion:        var(--baja);
  --direccion-suave:  var(--baja-suave);
  --fondo-direccion:  var(--fondo-baja);
}

body                { --activo: var(--acento); }
body.activo-oro     { --activo: var(--activo-oro); }
body.activo-wti     { --activo: var(--activo-wti); }
body.activo-us100   { --activo: var(--activo-us100); }
body.activo-usdclp  { --activo: var(--activo-usdclp); }
body.activo-bitcoin { --activo: var(--activo-bitcoin); }
body.activo-plata   { --activo: var(--activo-plata); }
body.activo-meli    { --activo: var(--activo-meli); }
body.activo-tech-circuito { --activo: var(--activo-tech-circuito); }
body.activo-usdjpy  { --activo: var(--activo-usdjpy); }
body.activo-eurusd  { --activo: var(--activo-eurusd); }
body.activo-gbpusd  { --activo: var(--activo-gbpusd); }
body.activo-us500   { --activo: var(--activo-us500); }
body.activo-us30    { --activo: var(--activo-us30); }
body.activo-iwm     { --activo: var(--activo-iwm); }
body.activo-eth     { --activo: var(--activo-eth); }
body.activo-sol     { --activo: var(--activo-sol); }
body.activo-ltc     { --activo: var(--activo-ltc); }
body.activo-ada     { --activo: var(--activo-ada); }
body.activo-doge    { --activo: var(--activo-doge); }

.story {
  box-shadow: inset 0 0 0 var(--filete-ancho) var(--filete);
}
</style>
<style>
@font-face { font-family: "Goldman"; src: url("fonts/goldman-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Goldman"; src: url("fonts/goldman-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: var(--fondo);
  color: var(--texto-1);
  font-family: var(--font-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.story {
  position: relative; width: 100%; height: 100%;
  padding: 48px 64px 36px;
  display: flex; flex-direction: column;
}

.velo {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--acento) 15%, transparent) 0%, transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,0.6) 0%, var(--velo-inferior) 100%);
}

.grilla {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,0.02) 0 1px, transparent 1px 96px);
}

.contenido {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: space-between;
}

.cabecera { display: flex; justify-content: space-between; align-items: flex-start; }

.sello {
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  letter-spacing: 0.10em; text-transform: uppercase; color: var(--acento);
  background: color-mix(in srgb, var(--fondo-acento) 85%, var(--fondo)); border: 1.5px solid var(--acento);
  border-radius: 999px; padding: 10px 26px;
}

.fecha { font-size: 24px; font-weight: 600; color: var(--texto-2); letter-spacing: 0.05em; }

.titulo {
  font-family: var(--font-display); font-weight: 700; font-size: 68px;
  color: var(--blanco); margin: 18px 0 0; letter-spacing: -0.01em;
}

.subtitulo {
  font-family: var(--font-sans); font-weight: 400; font-size: 30px;
  color: var(--texto-borde); margin: 10px 0 0;
}

.tabla-eventos {
  margin-top: 28px;
  display: flex; flex-direction: column; gap: 16px;
  flex: 1; justify-content: center;
}

.fila-evento {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 34px; border-radius: 22px;
  background: color-mix(in srgb, var(--fondo-acento) 75%, var(--fondo));
  border: 1.5px solid color-mix(in srgb, var(--acento) 25%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}

.ev-num {
  font-family: var(--font-display); font-weight: 700; font-size: 34px;
  color: var(--acento); width: 64px;
}
.ev-dia-hora {
  display: flex; flex-direction: column; width: 250px;
}
.ev-dia { font-weight: 700; font-size: 26px; text-transform: uppercase; color: var(--blanco); }
.ev-hora { font-weight: 600; font-size: 22px; color: var(--texto-2); margin-top: 2px; }

.ev-info { flex: 1; padding: 0 24px; }
.ev-nombre { font-weight: 700; font-size: 31px; line-height: 1.2; color: var(--blanco); }
.ev-pais { font-size: 20px; color: var(--texto-2); margin-top: 2px; }

.ev-datos {
  display: flex; gap: 32px; align-items: center;
}
.ev-stat { display: flex; flex-direction: column; text-align: right; min-width: 150px; }
.ev-stat-label { font-size: 17px; text-transform: uppercase; color: var(--texto-2); font-weight: 600; }
.ev-stat-val { font-family: var(--font-display); font-weight: 700; font-size: 32px; color: var(--blanco); margin-top: 2px; }

.tag-impacto {
  font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 8px 18px; border-radius: 999px;
  background: color-mix(in srgb, var(--baja) 20%, transparent); color: var(--baja); border: 1px solid var(--baja);
}

.footer {
  position: relative; z-index: 2; margin-top: 16px;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.15);
}
.footer-marca { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.08em; color: var(--acento); }
.footer-cta { font-family: var(--font-sans); font-weight: 600; font-size: 22px; color: var(--texto-2); margin: 0; }

/* Resultado de un dato ya publicado: la columna RESULTADO resalta en el acento
   y el tag pasa de "impacto" a veredicto. Solo el veredicto lleva color de dato. */
.ev-stat-actual .ev-stat-val { color: var(--acento); }
/* El cierre de una semana negativa va en rojo: es un dato, no cromo. */
.ev-stat-cierre-peor .ev-stat-val { color: var(--baja); }
.tag-mejor { background: color-mix(in srgb, var(--sube) 20%, transparent); color: var(--sube); border-color: var(--sube); }
.tag-en_linea { background: color-mix(in srgb, var(--texto-2) 18%, transparent); color: var(--blanco); border-color: var(--texto-2); }

/* ══════════ AGENDA DEL DÍA: pocos eventos, filas grandes (horizontal) ══════════
   Con uno o dos datos la tabla estándar se pierde en el lienzo. Sin tercera fila
   las filas crecen para llenar el espacio y se leen de lejos. */
@media (min-aspect-ratio: 11/10) {
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) { gap: 30px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .fila-evento {
    padding: 0 48px; min-height: 290px; border-radius: 30px;
  }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-num { font-size: 64px; width: 110px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-dia-hora { width: 250px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-dia { font-size: 34px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-hora { font-size: 46px; color: var(--blanco); margin-top: 6px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-nombre { font-size: 40px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-pais { font-size: 26px; margin-top: 8px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-datos { gap: 36px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-stat { min-width: 235px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-stat-label { font-size: 22px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .ev-stat-val { font-size: 54px; margin-top: 6px; }
  .tabla-eventos:not(:has(.fila-evento:nth-child(3))) .tag-impacto { font-size: 22px; padding: 12px 24px; }
}

/* ══════════ FORMATO VERTICAL 9:16 (1080×1920) ══════════ */
@media (max-aspect-ratio: 1/1) {
  .story {
    padding: 64px 48px 48px;
  }

  .sello {
    font-size: 20px;
    padding: 10px 24px;
  }

  .fecha {
    font-size: 22px;
  }

  .titulo {
    font-size: 56px;
    line-height: 1.12;
    margin: 20px 0 0;
  }

  .subtitulo {
    font-size: 26px;
    margin: 12px 0 0;
    line-height: 1.35;
  }

  .tabla-eventos {
    margin-top: 28px;
    gap: 16px;
    justify-content: space-evenly;
  }

  .fila-evento {
    padding: 22px 28px;
    border-radius: 24px;
  }

  .ev-num {
    font-size: 26px;
    width: 44px;
  }

  .ev-dia-hora {
    width: 175px;
  }

  .ev-dia {
    font-size: 20px;
  }

  .ev-hora {
    font-size: 18px;
    margin-top: 4px;
  }

  .ev-info {
    padding: 0 24px;
  }

  .ev-nombre {
    font-size: 24px;
    line-height: 1.25;
  }

  .ev-pais {
    font-size: 18px;
    margin-top: 4px;
  }

  .ev-datos {
    gap: 20px;
  }

  .ev-stat {
    min-width: 95px;
  }

  .ev-stat-label {
    font-size: 13px;
  }

  .ev-stat-val {
    font-size: 22px;
  }

  .tag-impacto {
    font-size: 14px;
    padding: 6px 16px;
  }

  .footer {
    margin-top: 24px;
    padding-top: 18px;
  }

  .footer-marca {
    font-size: 22px;
  }

  .footer-cta {
    font-size: 19px;
  }
}
</style>
</head>
<body>
  <div class="story">
    <div class="velo"></div>
    <div class="grilla"></div>

    <div class="contenido">
      <div>
        <div class="cabecera">
          <span class="sello">{{sello}}</span>
          <span class="fecha">{{fecha_hora}}</span>
        </div>
        <h1 class="titulo">{{titulo}}</h1>
        <p class="subtitulo">{{subtitulo}}</p>
      </div>

      <div class="tabla-eventos">
        <!-- FOR:eventos -->
        <div class="fila-evento">
          <span class="ev-num">{{numero}}</span>
          <div class="ev-dia-hora">
            <span class="ev-dia">{{dia}}</span>
            <span class="ev-hora">{{hora}}</span>
          </div>
          <div class="ev-info">
            <div class="ev-nombre">{{evento}}</div>
            <div class="ev-pais">{{pais}}</div>
          </div>
          <div class="ev-datos">
            <!-- IF:anterior -->
            <div class="ev-stat">
              <span class="ev-stat-label">Previo</span>
              <span class="ev-stat-val">{{anterior}}</span>
            </div>
            <!-- ENDIF:anterior -->
            <!-- IF:tiene_esperado -->
            <div class="ev-stat">
              <span class="ev-stat-label">Esperado</span>
              <span class="ev-stat-val">{{esperado}}</span>
            </div>
            <!-- ENDIF:tiene_esperado -->
            <!-- IF:tiene_actual -->
            <div class="ev-stat ev-stat-actual">
              <span class="ev-stat-label">Resultado</span>
              <span class="ev-stat-val">{{actual}}</span>
            </div>
            <!-- ENDIF:tiene_actual -->
            <!-- IF:cierre -->
            <div class="ev-stat ev-stat-actual ev-stat-cierre-{{impacto_slug}}">
              <span class="ev-stat-label">Cierre</span>
              <span class="ev-stat-val">{{cierre}}</span>
            </div>
            <!-- ENDIF:cierre -->
            <span class="tag-impacto tag-{{impacto_slug}}">{{impacto}}</span>
          </div>
        </div>
        <!-- ENDFOR:eventos -->
      </div>
    </div>

    <div class="footer">
      <span class="footer-marca">GRUPO INTELIGENCIA</span>
      <p class="footer-cta">{{cta}} · {{cta_sub}}</p>
    </div>
  </div>
</body>
</html>
