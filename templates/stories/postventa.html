<!--
Snapshot de marca "Post-Venta" (Stories GI · Fase C — plantilla interna). Guion operativo del
parte de post-venta: chip de INTERNO + fecha, la consulta del día con su respuesta, una franja
de niveles con color SEMÁNTICO (soporte verde / resistencia roja / sesgo con flecha) y DOS
listas independientes en dos columnas — qué responder y qué NO prometer.

DIFERENCIA CLAVE con el resto de los snapshots: esta pieza es INTERNA, no publicable. Por eso
(1) el chip "Interno · Post-venta" va LITERAL en el HTML, nunca como token — ningún payload
puede suprimirlo — y (2) el footer NO lleva @grupointeligencia, ni grupointeligencia.com, ni el
disclaimer de CFD (ese texto es para clientes y haría parecer publicable la pieza); en su lugar
va "Uso interno · No reenviar al cliente".

El verde #00DC82 y el rojo #E84040 son SEMÁNTICOS (soporte/resistencia, alcista/bajista), nunca
decorativos; el acento estructural es teal #3E91AF. Andamiaje de marca (fuentes, reset, fondo)
heredado verbatim de `templates/stories/edu.html`; patrón de color y flechas por CSS ::before
tomado de `templates/stories/resumen.html`.

Las dos listas usan el mecanismo loop del motor (marcadores reales en los contenedores más
abajo; NO escribir el literal del marcador en este comentario, porque `resolver_loops` lo
tomaría como marca de apertura). Los rótulos de columna viven FUERA de las marcas del loop, para
que persistan con lista vacía. NO cambiar nombres de tokens sin actualizar
scripts/story_render.py y tests/test_story_render.py.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post-Venta — Story GI</title>
<style>
  @font-face {
    font-family: "Syne";
    src: url("fonts/syne-800.woff2") format("woff2");
    font-weight: 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("fonts/dm-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("fonts/dm-sans-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-600.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; }

  /* El snapshot NO declara su tamaño en px: lo manda el viewport del motor
     (--formato horizontal | vertical) y el CSS se adapta. Antes estaba fijo en
     1920x1080 aqui Y en render_png, una duplicacion que al divergir cortaba el
     render sin que nada lo detectara. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #0D0D1A;
    background-image:
      radial-gradient(90% 120% at 0% 20%, #10222B 0%, #0D0D1A 55%),
      linear-gradient(180deg, #0D0D1A 0%, #0D0D1A 60%, #10222B 100%);
    color: #F5F3F7;
    font-family: "DM Sans", sans-serif;
    overflow: hidden;
  }

  .story {
    width: 100%;
    height: 100%;
    padding: 52px 80px 36px;
    display: flex;
    flex-direction: column;
  }

  /* ---- Encabezado ---- */
  .pv-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pv-chip {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 22px;
    border-radius: 999px;
    background: rgba(62, 145, 175, 0.14);
    border: 1px solid rgba(62, 145, 175, 0.5);
    color: #3E91AF;
  }

  .pv-fecha {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #A9A5B4;
  }

  /* ---- Consulta del día ---- */
  .pv-rotulo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #3E91AF;
    margin: 40px 0 14px;
  }

  /* ÚNICA plantilla del catálogo cuyo título NO usa Syne 800.
     Syne es ancho por diseño (no está estirado: cero scaleX/font-stretch), y a
     tamaño de titular esa anchura se lee como grito en una pieza que debe
     informar rápido. Como ésta es la única pieza INTERNA -- no representa a GI
     ante ningún cliente -- la legibilidad operativa pesa más que la
     consistencia de marca. Se usa Space Grotesk 600, que ya es la fuente
     dominante del snapshot (chip, fecha, rótulos, precios): el título pasa a
     hablar el mismo idioma que los datos. Sigue dentro del kit GI. */
  .pv-consulta {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 50px;
    line-height: 1.14;
    letter-spacing: -0.01em;
    color: #FFFFFF;
    margin: 0;
    max-width: 1440px;
  }

  .pv-respuesta {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.4;
    color: #C9C5D4;
    margin: 18px 0 0;
    max-width: 1560px;
  }

  /* ---- Franja de niveles: el color es SEMÁNTICO ----
     Agrupada y centrada con ancho acotado: a todo el ancho de 1920px los
     extremos quedaban contra los bordes y obligaban a un paneo visual entre
     soporte y resistencia. */
  .pv-niveles {
    margin: 34px auto 0;
    padding: 22px 56px;
    width: fit-content;
    max-width: 1240px;
    border-top: 1px solid rgba(245, 243, 247, 0.10);
    border-bottom: 1px solid rgba(245, 243, 247, 0.10);
    display: grid;
    grid-template-columns: auto auto auto;
    gap: 96px;
    align-items: center;
  }

  .pv-nivel-rotulo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #A9A5B4;
    margin-bottom: 6px;
  }

  .pv-nivel-valor {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 40px;
  }

  .pv-nivel--soporte .pv-nivel-valor { color: #00DC82; }

  .pv-nivel--resistencia { text-align: right; }
  .pv-nivel--resistencia .pv-nivel-valor { color: #E84040; }

  .pv-nivel--centro { text-align: center; }
  .pv-nivel--centro .pv-nivel-valor { color: #F5F3F7; }

  .pv-sesgo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 21px;
    margin-top: 4px;
  }

  .pv-sesgo--alcista { color: #00DC82; }
  .pv-sesgo--alcista::before { content: "\25B2\00A0"; }

  .pv-sesgo--bajista { color: #E84040; }
  .pv-sesgo--bajista::before { content: "\25BC\00A0"; }

  .pv-sesgo--lateral { color: #A9A5B4; }
  .pv-sesgo--lateral::before { content: "\2192\00A0"; }

  /* ---- Dos columnas: responder / no prometer ---- */
  .pv-cuerpo {
    flex: 1;
    min-height: 0;
    margin-top: 34px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 72px;
  }

  .pv-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .pv-col-titulo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding-bottom: 12px;
    margin-bottom: 8px;
  }

  .pv-col--responder .pv-col-titulo {
    color: #00DC82;
    border-bottom: 2px solid rgba(0, 220, 130, 0.45);
  }

  .pv-col--prometer .pv-col-titulo {
    color: #E84040;
    border-bottom: 2px solid rgba(232, 64, 64, 0.45);
  }

  .pv-item {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 23px;
    line-height: 1.35;
    color: #F5F3F7;
    padding: 15px 0 15px 26px;
    position: relative;
  }

  .pv-item::before {
    content: "\25B8";
    position: absolute;
    left: 0;
    color: #3E91AF;
  }

  /* ---- Footer INTERNO: sin handle, sin dominio, sin disclaimer de CFD ----
     El aviso de no-reenvío es una regla de compliance, no una nota al pie: en
     gris #6E6A7A daba 3,68:1 de contraste (bajo el mínimo WCAG AA de 4,5:1) y
     un ejecutivo apurado podía pasarlo por alto antes de sacar un pantallazo.
     En ámbar #FFB020 sobre el fondo da 10,54:1 y se lee a distancia. */
  .pv-footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    /* #A9A5B4 (gris secundario del kit) = 6,79:1 sobre el fondo del footer.
       El #6E6A7A original daba 3,12:1, bajo el minimo AA. Es metadato, no
       compliance, pero se iguala por coherencia con el resto del catalogo. */
    color: #A9A5B4;
  }

  .pv-aviso {
    font-size: 19px;
    letter-spacing: 0.07em;
    color: #FFB020;
    padding: 11px 26px;
    border-radius: 8px;
    background: rgba(255, 176, 32, 0.12);
    border: 1px solid rgba(255, 176, 32, 0.55);
  }

  /* ================= FORMATO VERTICAL 9:16 (1080x1920) =================
     Se activa solo cuando el lienzo es mas alto que ancho, es decir con
     `--formato vertical`. Dos cambios de fondo: las columnas se apilan (no
     caben lado a lado en 1080 px) y toda la tipografia sube, porque el mismo
     texto a tamano de escritorio queda diminuto en un telefono.
     El chip de INTERNO y el aviso ambar se conservan: son guardrails. */
  @media (max-aspect-ratio: 1/1) {
    .story { padding: 80px 64px 56px; }

    .pv-chip { font-size: 26px; padding: 13px 30px; }
    .pv-fecha { font-size: 26px; }

    .pv-rotulo { font-size: 24px; margin: 56px 0 18px; }
    .pv-consulta { font-size: 76px; line-height: 1.1; max-width: 100%; }
    .pv-respuesta { font-size: 40px; margin-top: 26px; max-width: 100%; }

    /* Los tres niveles siguen en fila -- caben en 1080 px con menos gap. */
    .pv-niveles {
      margin-top: 48px;
      padding: 34px 24px;
      width: 100%;
      max-width: 100%;
      gap: 24px;
    }
    .pv-nivel-rotulo { font-size: 21px; }
    .pv-nivel-valor { font-size: 50px; }
    .pv-sesgo { font-size: 28px; }

    /* Las dos columnas se apilan: primero que responder, luego que NO.
       `grid-template-rows: auto auto` + `align-content: start` es lo que evita
       que el grid reparta el alto en dos mitades iguales: con 5 items arriba y
       3 abajo, esa reparticion hacia que la primera lista desbordara su mitad
       y el rotulo de la segunda quedara encima del ultimo item. */
    .pv-cuerpo {
      margin-top: 44px;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 40px;
    }
    .pv-col-titulo { font-size: 26px; padding-bottom: 14px; }
    .pv-item { font-size: 30px; padding: 14px 0 14px 34px; line-height: 1.3; }

    /* El footer tambien se apila: en 1080 px de ancho el badge de no-reenvio y
       la linea de fuente no caben lado a lado sin pisarse. */
    .pv-footer {
      margin-top: 32px;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      font-size: 21px;
    }
    .pv-aviso { font-size: 26px; padding: 15px 30px; }
  }
</style>
</head>
<body class="postventa">
  <div class="story">

    <div class="pv-head">
      <span class="pv-chip">🔒 Interno · Post-venta</span>
      <span class="pv-fecha">{{fecha_hora}}</span>
    </div>

    <div class="pv-rotulo">La consulta de hoy</div>
    <h1 class="pv-consulta">{{consulta}}</h1>
    <p class="pv-respuesta">{{respuesta}}</p>

    <div class="pv-niveles">
      <div class="pv-nivel pv-nivel--soporte">
        <div class="pv-nivel-rotulo">Soporte</div>
        <div class="pv-nivel-valor">{{soporte}}</div>
      </div>
      <div class="pv-nivel pv-nivel--centro">
        <div class="pv-nivel-rotulo">{{activo_nombre}}</div>
        <div class="pv-nivel-valor">{{precio}}</div>
        <div class="pv-sesgo pv-sesgo--{{sesgo_slug}}">{{sesgo}}</div>
      </div>
      <div class="pv-nivel pv-nivel--resistencia">
        <div class="pv-nivel-rotulo">Resistencia</div>
        <div class="pv-nivel-valor">{{resistencia}}</div>
      </div>
    </div>

    <div class="pv-cuerpo">
      <div class="pv-col pv-col--responder">
        <div class="pv-col-titulo">✅ Qué responder</div>
        <!-- FOR:respuestas --><div class="pv-item">{{texto}}</div><!-- ENDFOR:respuestas -->
      </div>
      <div class="pv-col pv-col--prometer">
        <div class="pv-col-titulo">⚠️ Qué NO prometer</div>
        <!-- FOR:no_promesas --><div class="pv-item">{{texto}}</div><!-- ENDFOR:no_promesas -->
      </div>
    </div>

    <div class="pv-footer">
      <span class="pv-aviso">⚠️ Uso interno · No reenviar al cliente</span>
      <span>Fuente: {{fuente}}</span>
    </div>

  </div>
</body>
</html>
