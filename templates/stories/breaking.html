<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Breaking News</title>
<style>
  /* ════ marca.css embebido ════ */
:root {

  --fondo:          #000000;
  --fondo-acento:   #0E2420;
  --fondo-alt:      #0A0A0F;
  --fondo-sube:     #123A2A;
  --fondo-baja:     #2A1220;

  --acento:         #50C0A8;
  --acento-azul:    #3C8CAA;
  --acento-oscuro:  #143028;

  --sube:           #00DC82;
  --sube-suave:     #53C1AB;
  --baja:           #E84040;
  --baja-suave:     #F5A3A3;
  --aviso:          #FFB020;

  --activo-oro:    #E8B44C;
  --activo-wti:    #E8783C;
  --activo-us100:  #4C86E8;
  --activo-usdclp: var(--acento);
  --activo-bitcoin:#F7931A;

  --activo-plata:  #C6CBD1;
  --activo-meli:   #F2C14E;
  --activo-tech-circuito: #4FB0C6;

  --activo-usdjpy: #B98A4A;
  --activo-eurusd: #6E7E96;
  --activo-gbpusd: #9E6B4A;
  --activo-us500:  #6BA3D8;
  --activo-us30:   #9C7B4E;
  --activo-iwm:    #8F9BA8;
  --activo-eth:    #7B7FE8;
  --activo-sol:    #C158D6;
  --activo-ltc:    #A8B2BF;
  --activo-ada:    #3B6FD4;
  --activo-doge:   #D9A22B;

  --font-display:   "Goldman", sans-serif;
  --font-titular:   "Goldman", sans-serif;
  --font-sans:      "Plus Jakarta Sans", "Segoe UI", "Noto Sans", Arial, sans-serif;
  --font-emoji:     "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji";
  --texto-1:        #F5F3F7;
  --texto-2:        #A9A5B4;
  --texto-3:        #6E6A7A;
  --texto-borde:    #C9C5D4;
  --texto-gris:     #8E8A9C;
  --blanco:         #FFFFFF;

  --filete:         var(--acento);
  --filete-ancho:   4px;
}

body {
  --direccion:        var(--acento);
  --direccion-suave:  var(--texto-borde);
  --fondo-direccion:  var(--fondo-acento);
}
body.sesgo-alcista, body.sesgo-compra {
  --direccion:        var(--sube);
  --direccion-suave:  var(--sube-suave);
  --fondo-direccion:  var(--fondo-sube);
}
body.sesgo-bajista, body.sesgo-venta {
  --direccion:        var(--baja);
  --direccion-suave:  var(--baja-suave);
  --fondo-direccion:  var(--fondo-baja);
}

body                { --activo: var(--acento); }
body.activo-oro     { --activo: var(--activo-oro); }
body.activo-wti     { --activo: var(--activo-wti); }
body.activo-us100   { --activo: var(--activo-us100); }
body.activo-usdclp  { --activo: var(--activo-usdclp); }
body.activo-bitcoin { --activo: var(--activo-bitcoin); }
body.activo-plata   { --activo: var(--activo-plata); }
body.activo-meli    { --activo: var(--activo-meli); }
body.activo-tech-circuito { --activo: var(--activo-tech-circuito); }
body.activo-usdjpy  { --activo: var(--activo-usdjpy); }
body.activo-eurusd  { --activo: var(--activo-eurusd); }
body.activo-gbpusd  { --activo: var(--activo-gbpusd); }
body.activo-us500   { --activo: var(--activo-us500); }
body.activo-us30    { --activo: var(--activo-us30); }
body.activo-iwm     { --activo: var(--activo-iwm); }
body.activo-eth     { --activo: var(--activo-eth); }
body.activo-sol     { --activo: var(--activo-sol); }
body.activo-ltc     { --activo: var(--activo-ltc); }
body.activo-ada     { --activo: var(--activo-ada); }
body.activo-doge    { --activo: var(--activo-doge); }

.story {
  box-shadow: inset 0 0 0 var(--filete-ancho) var(--filete);
}
</style>
<style>
@font-face { font-family: "Goldman"; src: url("fonts/goldman-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Goldman"; src: url("fonts/goldman-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 1920px; height: 1080px;
  background: var(--fondo);
  color: var(--texto-1);
  font-family: var(--font-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.story {
  position: relative; width: 100%; height: 100%;
  padding: 56px 72px 40px;
  display: flex; flex-direction: column;
}

.velo {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--baja) 15%, transparent) 0%, transparent 60%),
    radial-gradient(circle at 20% 80%, color-mix(in srgb, var(--acento) 12%, transparent) 0%, transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(4,18,14,0.95) 100%);
}

.grilla {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,0.02) 0 1px, transparent 1px 96px);
}

.contenido {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: flex; flex-direction: row; gap: 56px;
}

.col-izq {
  flex: 0 0 54%;
  display: flex; flex-direction: column; justify-content: space-between;
}

.col-der {
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
}

.chips { display: flex; gap: 14px; align-items: center; }

.sello {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 18px; border: 1.5px solid var(--baja);
  border-radius: 999px; background: color-mix(in srgb, var(--baja) 25%, var(--fondo));
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  letter-spacing: 0.10em; text-transform: uppercase; color: var(--baja);
  box-shadow: 0 0 24px color-mix(in srgb, var(--baja) 35%, transparent);
}
.pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--baja); }

.chip-tema {
  font-family: var(--font-sans); font-weight: 700; font-size: 13px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 16px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--blanco);
}
.chip-tema:empty { display: none; }

.titular {
  font-family: var(--font-display); font-weight: 700; font-size: 48px;
  line-height: 1.12; margin: 18px 0 0; color: var(--blanco);
  letter-spacing: -0.01em;
}

.parrafo-reaccion {
  font-family: var(--font-sans); font-weight: 400; font-size: 22px;
  line-height: 1.48; color: var(--texto-borde); margin: 18px 0 0;
}

.tarjeta-cifra {
  border-radius: 28px;
  background: color-mix(in srgb, var(--fondo-acento) 80%, var(--fondo));
  border: 1.5px solid color-mix(in srgb, var(--acento) 40%, transparent);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.25), 0 20px 50px rgba(0, 0, 0, 0.65);
  padding: 44px 48px;
  display: flex; flex-direction: column; justify-content: center;
}

.cifra-label {
  font-family: var(--font-sans); font-weight: 700; font-size: 16px;
  letter-spacing: 0.10em; text-transform: uppercase; color: var(--acento);
}

.cifra-valor {
  font-family: var(--font-display); font-weight: 700; font-size: 82px;
  line-height: 1.05; color: var(--blanco); margin: 10px 0 0;
}

.cifra-contexto {
  font-family: var(--font-sans); font-weight: 400; font-size: 22px;
  line-height: 1.45; color: var(--texto-2); margin: 18px 0 0;
  border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 18px;
}

.footer {
  position: relative; z-index: 2; margin-top: 20px;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.15);
}
.footer-marca { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.08em; color: var(--acento); }
.footer-disc { font-family: var(--font-sans); font-weight: 400; font-size: 13px; color: var(--texto-3); margin: 0; }
</style>
</head>
<body>
  <div class="story">
    <div class="velo"></div>
    <div class="grilla"></div>

    <div class="contenido">
      <div class="col-izq">
        <div>
          <div class="chips">
            <span class="sello"><span class="pulso"></span>Última hora</span>
            <span class="chip-tema">{{kicker_tema}}</span>
          </div>
          <h1 class="titular">{{titular}}</h1>
        </div>
        <p class="parrafo-reaccion">{{parrafo_reaccion}}</p>
      </div>

      <div class="col-der">
        <div class="tarjeta-cifra">
          <span class="cifra-label">Dato Destacado</span>
          <div class="cifra-valor">{{valor}}</div>
          <p class="cifra-contexto">{{contexto}}</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-marca">GRUPO INTELIGENCIA</span>
      <p class="footer-disc">Información con fines informativos y de análisis de coyuntura. No constituye asesoría financiera.</p>
    </div>
  </div>
</body>
</html>
