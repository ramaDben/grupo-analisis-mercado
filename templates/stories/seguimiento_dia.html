<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Seguimiento de hoy</title>
<style>
  /* ════ marca.css embebido ════ */
:root {

  --fondo:          #000000;
  --fondo-acento:   #0E2420;
  --fondo-alt:      #0A0A0F;
  --fondo-sube:     #123A2A;
  --fondo-baja:     #2A1220;

  --velo-inferior:  rgba(4, 18, 14, 0.95);

  --acento:         #50C0A8;
  --acento-azul:    #3C8CAA;
  --acento-oscuro:  #143028;

  --sube:           #00DC82;
  --sube-suave:     #53C1AB;
  --baja:           #E84040;
  --baja-suave:     #F5A3A3;
  --aviso:          #FFB020;

  --activo-oro:    #E8B44C;
  --activo-wti:    #E8783C;
  --activo-us100:  #4C86E8;
  --activo-usdclp: var(--acento);
  --activo-bitcoin:#F7931A;

  --activo-plata:  #C6CBD1;
  --activo-copper: #B87333;
  --activo-meli:   #F2C14E;
  --activo-tech-circuito: #4FB0C6;

  --activo-usdjpy: #B98A4A;
  --activo-eurusd: #6E7E96;
  --activo-gbpusd: #9E6B4A;
  --activo-us500:  #6BA3D8;
  --activo-us30:   #9C7B4E;
  --activo-iwm:    #8F9BA8;
  --activo-eth:    #7B7FE8;
  --activo-sol:    #C158D6;
  --activo-ltc:    #A8B2BF;
  --activo-ada:    #3B6FD4;
  --activo-doge:   #D9A22B;

  --font-display:   "Goldman", sans-serif;
  --font-titular:   "Goldman", sans-serif;
  --font-sans:      "Plus Jakarta Sans", "Segoe UI", "Noto Sans", Arial, sans-serif;
  --font-emoji:     "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji";
  --texto-1:        #F5F3F7;
  --texto-2:        #A9A5B4;
  --texto-3:        #6E6A7A;
  --texto-borde:    #C9C5D4;
  --texto-gris:     #8E8A9C;
  --blanco:         #FFFFFF;

  --papel:          #FFFFFF;
  --papel-alt:      #F8FAFC;
  --papel-linea:    #E2E8F0;
  --tinta:          #0F172A;
  --tinta-2:        #334155;
  --tinta-3:        #64748B;
  --banda-1:        #06231C;
  --banda-2:        #124B5E;
  --acento-doc:     #176B61;
  --acento-tenue:   #E6F7F2;
  --sube-doc:       #047857;
  --sube-tenue:     #ECFDF5;
  --baja-doc:       #B91C1C;
  --baja-tenue:     #FEF2F2;
  --aviso-tenue:    #FFF7ED;

  --filete:         var(--acento);
  --filete-ancho:   4px;
}

body {
  --direccion:        var(--acento);
  --direccion-suave:  var(--texto-borde);
  --fondo-direccion:  var(--fondo-acento);
}
body.sesgo-alcista, body.sesgo-compra {
  --direccion:        var(--sube);
  --direccion-suave:  var(--sube-suave);
  --fondo-direccion:  var(--fondo-sube);
}
body.sesgo-bajista, body.sesgo-venta {
  --direccion:        var(--baja);
  --direccion-suave:  var(--baja-suave);
  --fondo-direccion:  var(--fondo-baja);
}

body                { --activo: var(--acento); }
body.activo-oro     { --activo: var(--activo-oro); }
body.activo-wti     { --activo: var(--activo-wti); }
body.activo-us100   { --activo: var(--activo-us100); }
body.activo-usdclp  { --activo: var(--activo-usdclp); }
body.activo-bitcoin { --activo: var(--activo-bitcoin); }
body.activo-plata   { --activo: var(--activo-plata); }
body.activo-copper  { --activo: var(--activo-copper); }
body.activo-meli    { --activo: var(--activo-meli); }
body.activo-tech-circuito { --activo: var(--activo-tech-circuito); }
body.activo-usdjpy  { --activo: var(--activo-usdjpy); }
body.activo-eurusd  { --activo: var(--activo-eurusd); }
body.activo-gbpusd  { --activo: var(--activo-gbpusd); }
body.activo-us500   { --activo: var(--activo-us500); }
body.activo-us30    { --activo: var(--activo-us30); }
body.activo-iwm     { --activo: var(--activo-iwm); }
body.activo-eth     { --activo: var(--activo-eth); }
body.activo-sol     { --activo: var(--activo-sol); }
body.activo-ltc     { --activo: var(--activo-ltc); }
body.activo-ada     { --activo: var(--activo-ada); }
body.activo-doge    { --activo: var(--activo-doge); }

.story {
  box-shadow: inset 0 0 0 var(--filete-ancho) var(--filete);
}
</style>
<style>
@font-face { font-family: "Goldman"; src: url("fonts/goldman-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--fondo); color: var(--texto-1);
  font-family: var(--font-sans); font-weight: 600; overflow: hidden; -webkit-font-smoothing: antialiased; }

.story { position: relative; width: 100%; height: 100%; padding: 40px 56px 22px; display: flex; flex-direction: column;
  background: radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--acento) 14%, transparent), transparent 55%),
              linear-gradient(180deg, color-mix(in srgb, var(--fondo-acento) 40%, var(--fondo)), var(--velo-inferior)); }
.wm { position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; transform: translate(-42%, -50%);
  opacity: .08; z-index: 0; pointer-events: none; }
.contenido { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; }

.cabecera { display: flex; justify-content: space-between; align-items: center; }
.chip { font-family: var(--font-sans); font-weight: 700; font-size: 22px; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--acento); border: 1.5px solid var(--acento); border-radius: 999px; padding: 9px 26px;
  background: color-mix(in srgb, var(--velo-inferior) 80%, transparent); }
.fecha { font-size: 26px; font-weight: 700; color: var(--texto-1); }

.cuerpo { flex: 1; min-height: 0; display: flex; gap: 40px; margin-top: 24px; }
.izq { width: 890px; display: flex; flex-direction: column; justify-content: flex-start; }
.der { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }

.vidrio { background: color-mix(in srgb, var(--velo-inferior) 80%, transparent); backdrop-filter: blur(28px);
  border: 1.5px solid color-mix(in srgb, var(--acento) 22%, transparent); border-radius: 16px;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--acento) 40%, transparent); }

.fila-activo { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.activo { font-weight: 700; font-size: 26px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--texto-borde); margin: 0; }
.pildora-dir { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 16px; border-radius: 999px; border: 1.5px solid var(--texto-borde); color: var(--texto-borde);
  background: color-mix(in srgb, var(--velo-inferior) 80%, transparent); }
.pildora-dir.alcista { border-color: var(--sube); color: var(--sube); background: color-mix(in srgb, var(--sube) 15%, transparent); }
.pildora-dir.bajista { border-color: var(--baja); color: var(--baja); background: color-mix(in srgb, var(--baja) 15%, transparent); }
.pildora-dir.lateral { border-color: var(--texto-2); color: var(--texto-2); background: color-mix(in srgb, var(--texto-2) 15%, transparent); }

.bloque-suceso { display: flex; align-items: flex-start; gap: 20px; margin-top: 10px; }
.flecha { font-size: 68px; line-height: 1.1; flex-shrink: 0; }
.titular { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1.18; color: var(--blanco); margin: 0; letter-spacing: 0.01em; }

.linea-chica { font-size: 32px; font-weight: 600; line-height: 1.35; color: var(--texto-1); margin: 32px 0 0; }

.nota-semana { margin-top: auto; padding: 20px 24px; font-size: 26px; font-weight: 600; line-height: 1.35; color: var(--texto-2); border-left: 4px solid var(--acento); }
.nota-semana:empty { display: none; }

.grafico { overflow: hidden; }
.grafico img { width: 100%; height: auto; display: block; }
.grafico-pie { font-size: 24px; color: var(--texto-borde); margin: 10px 0 0; }

.footer { position: relative; z-index: 2; margin-top: 10px; padding-top: 8px; display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid color-mix(in srgb, var(--texto-1) 15%, transparent); }
.footer-marca { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.08em; color: var(--acento); }
.footer-texto { font-size: 24px; color: var(--texto-1); margin: 0; text-align: right; line-height: 1.25; }
</style>
</head>
<body>
  <div class="story">
    <img class="wm" src="{{logo_src}}" alt="">
    <div class="contenido">
      <div class="cabecera">
        <span class="chip">{{chip}}</span>
        <span class="fecha">Datos al {{datos_al}}</span>
      </div>
      <div class="cuerpo">
        <div class="izq">
          <div class="fila-activo">
            <p class="activo">{{activo}}</p>
            <span class="pildora-dir {{direccion}}">{{direccion}}</span>
          </div>
          <div class="bloque-suceso">
            <span class="flecha">{{flecha}}</span>
            <h1 class="titular">{{titular}}</h1>
          </div>
          <p class="linea-chica">{{linea_chica}}</p>
          <div class="nota-semana vidrio">{{nota_semana}}</div>
        </div>
        <div class="der">
          <div class="grafico vidrio">
            <!-- IF:chart_img --><img src="{{chart_src}}" alt="Gráfico de 15 minutos"><!-- ENDIF:chart_img -->
            <!-- IF:chart_svg --><!-- ENDIF:chart_svg -->
          </div>
          <p class="grafico-pie">{{pie_imagen}}</p>
        </div>
      </div>
    </div>
    <div class="footer">
      <span class="footer-marca">GRUPO INTELIGENCIA</span>
      <p class="footer-texto">{{firma}}<br>{{aviso}}</p>
    </div>
  </div>
</body>
</html>
