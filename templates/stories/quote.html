.foto-activo {
  position: absolute; inset: 0 -72px 0 auto;
  width: 58%;
  z-index: 1;
  object-fit: cover;
  -webkit-mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.35) 22%, var(--fondo) 62%),
    linear-gradient(180deg, var(--fondo) 0%, var(--fondo) 62%, transparent 96%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.35) 22%, var(--fondo) 62%),
    linear-gradient(180deg, var(--fondo) 0%, var(--fondo) 62%, transparent 96%);
  mask-composite: intersect;
  filter: saturate(1.12) contrast(1.06) brightness(0.92);
  pointer-events: none;
}

.foto-activo--fondo {
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  -webkit-mask-image:
    linear-gradient(180deg, var(--fondo) 0%, var(--fondo) 58%, rgba(0,0,0,0.30) 100%);
  mask-image:
    linear-gradient(180deg, var(--fondo) 0%, var(--fondo) 58%, rgba(0,0,0,0.30) 100%);
  filter: saturate(0.82) contrast(0.94) brightness(0.36);
  opacity: 0.55;
}

.ilustracion {
  position: absolute; right: -16px; top: 37%;
  transform: translateY(-50%);
  z-index: 2;
  width: 520px;
  filter: drop-shadow(0 0 90px color-mix(in srgb, var(--activo) 55%, transparent));
  pointer-events: none;
}

.velo {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(100deg, var(--fondo) 24%, rgba(0,0,0,0.88) 44%, rgba(0,0,0,0.26) 70%, rgba(0,0,0,0.58) 100%),
    radial-gradient(58% 78% at 8% 34%, color-mix(in srgb, var(--activo) 26%, transparent) 0%, rgba(0,0,0,0) 64%),
    radial-gradient(46% 62% at 96% 92%, color-mix(in srgb, var(--acento-azul) 34%, transparent) 0%, rgba(0,0,0,0) 60%);
}

.grilla {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,0.026) 0 1px, transparent 1px 96px);
}

.capa { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

.story::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  box-shadow: inset 0 0 0 var(--filete-ancho) var(--filete);
}

.sello {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 11px 24px 11px 18px;
  border: 1px solid color-mix(in srgb, var(--activo) 46%, transparent);

}
.pulso {
  width: 11px; height: 11px; border-radius: 50%;

.cta {

    position: static; transform: none;
    display: block; width: 330px; margin: 4px 0 0 auto;
  }

  .cta { padding: 28px 0 18px; gap: 24px; }
  .cta-flecha { width: 68px; height: 68px; flex-basis: 68px; font-size: 34px; }
  .cta-titulo { font-size: 36px; }
  .cta-sub { font-size: 26px; }
  .cta-handle { display: none; }
  .cta-logo { height: 78px; }
  .disclaimer { font-size: 16px; padding-bottom: 24px; }
}
