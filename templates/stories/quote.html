<!--
Snapshot de marca "Quote" (Stories GI · Fase B, issue #121). Pieza 100% editorial —
cita + autor + cargo, sin gráfico ni dato del motor. Reutiliza verbatim el andamiaje
de marca (fuentes/paleta/footer) de `templates/stories/alerta.html:14-58,398-409`.
Primer consumidor del motor sin fences IF/FOR ni loops: los tres tokens de este
archivo ({{cita}}, {{autor}}, {{autor_sub}}) son escalares incondicionales.
NO cambiar nombres de tokens sin actualizar tests/test_story_render.py.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Quote — Story GI</title>
<link rel="stylesheet" href="marca.css">
<style>
  @font-face {
    font-family: "Syne";
    src: url("fonts/syne-800.woff2") format("woff2");
    font-weight: 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("fonts/dm-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("fonts/dm-sans-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-600.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: var(--fondo);
    background-image:
      radial-gradient(90% 120% at 0% 20%, var(--fondo-baja) 0%, var(--fondo) 55%),
      linear-gradient(180deg, var(--fondo) 0%, var(--fondo-alt) 60%, var(--fondo) 100%);
    color: var(--texto-1);
    font-family: "DM Sans", sans-serif;
    overflow: hidden;
  }

  /* ---- Contenedor raíz: columna (cuerpo | footer) ---- */
  .story {
    width: 1920px;
    height: 1080px;
    padding: 56px 72px 40px;
    display: flex;
    flex-direction: column;
  }

  /* ---- Cuerpo: cita centrada vertical y horizontalmente ---- */
  .quote-cuerpo {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 120px;
  }

  .quote-texto {
    font-family: "DM Sans", sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.3;
    color: var(--blanco);
    margin: 0;
    max-width: 1400px;
  }

  .quote-texto::before,
  .quote-texto::after {
    font-family: "DM Sans", sans-serif;
    font-weight: 700;
    color: var(--baja);
  }

  .quote-texto::before {
    content: "\201C";
  }

  .quote-texto::after {
    content: "\201D";
  }

  .quote-atribucion {
    margin-top: 40px;
  }

  .quote-autor {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.03em;
    color: var(--texto-1);
    margin: 0;
  }

  .quote-cargo {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: var(--texto-2);
    margin: 8px 0 0;
  }

  .quote-cargo:empty {
    display: none;
  }

  /* ---- Footer ---- */
  .footer {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .footer-marca {
    display: flex;
    justify-content: space-between;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--texto-1);
  }

  .footer-disclaimer {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 13px;
    /* var(--texto-2) (gris secundario del kit). El var(--texto-3) anterior no alcanzaba el
       minimo WCAG AA de 4,5:1 sobre el fondo del footer -- y este texto es el
       aviso de riesgo por apalancamiento, tiene que poder leerse. */
    color: var(--texto-2);
    line-height: 1.35;
  }
</style>
</head>
<body class="quote">
  <div class="story">

    <div class="quote-cuerpo">
      <blockquote class="quote-texto">{{cita}}</blockquote>
      <div class="quote-atribucion">
        <p class="quote-autor">{{autor}}</p>
        <p class="quote-cargo">{{autor_sub}}</p>
      </div>
    </div>

    <div class="footer">
      <div class="footer-marca">
        <span>@grupointeligencia</span>
        <span>grupointeligencia.com</span>
      </div>
      <p class="footer-disclaimer">
        Los CFD son instrumentos complejos y presentan un riesgo elevado de perder dinero
        rápidamente debido al apalancamiento. Este contenido es educativo/informativo, no
        constituye asesoría financiera.
      </p>
    </div>

  </div>
</body>
</html>
