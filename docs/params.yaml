# PARAMS.YAML · FUENTE ÚNICA DE VERDAD (SSOT) · GRUPO INTELIGENCIA
# Manual de Operaciones · Trading Cuantitativo Intermercado
# Versión Interna: 3.0.1 | Edición Pública: Versión 1.0 (Octubre 2026)
