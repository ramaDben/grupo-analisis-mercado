@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
body { 
    margin: 0; padding: 0; 
    font-family: 'Inter', sans-serif; 
    background: #06231C; 
    color: #FFFFFF; 
    -webkit-font-smoothing: antialiased;
}
.cover {
    width: 794px; height: 1123px;
    padding: 24mm 32mm;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    background: #06231C;
}
.cover-gradient {
    position: absolute; top: 0; right: 0; width: 42%; height: 100%;
    background: linear-gradient(180deg, #0F4539 0%, #06231C 100%);
    opacity: 0.6;
}
.top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.logo { font-family: 'Goldman', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; }
.badge { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; color: #3E91AF; text-transform: uppercase; }
