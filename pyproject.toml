[project]
name = "grupo-analisis-mercado"
version = "0.6.0"
description = "Sistema automatizado del Grupo de Análisis de Mercado (MCP market-data + slash commands)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pandas",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "yfinance>=1.6.0",
]

[project.optional-dependencies]
# Render de Stories GI (#109): Playwright headless, opcional, NO forzado en el
# core (issue #79/D6 — instalación manual: uv sync --extra stories && python -m
# playwright install chromium).
stories = ["playwright"]
# Tests de visibilidad: OCR para verificar que elementos críticos aparecen en PNG
# (uv sync --extra stories-test)
stories-test = ["playwright", "easyocr", "pillow"]
# Informe de la jornada. Opcional por el mismo criterio que `stories`: el core
# del MCP no lo necesita y no se fuerza en cada entorno.
#
# Son cuatro y no una. Hasta el 2026-09-06 este extra declaraba solo matplotlib,
# que es lo que necesita el grafico, y se pasaba por alto que el PDF lo compila
# `.agents/skills/generar-reporte-editorial/scripts/generar_pdf.py`, que importa
# markdown, pypdf y playwright en el nivel de modulo. En un clon nuevo, `--extra
# informe` instalaba matplotlib y el render moria con ModuleNotFoundError. Se
# descubrio corriendo el informe desde el segundo runner, que no tenia esos
# paquetes y tuvo que instalarlos a mano para poder terminar.
#
# Lo impide ahora `test_el_extra_informe_cubre_lo_que_el_generador_importa`.
informe = ["matplotlib", "markdown", "pypdf", "playwright"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "numpy",  # solo usado en los tests (tests/)
]

# Proyecto "virtual": no se construye/instala como paquete. market_data_mcp se
# importa vía el sys.path que arman server.py y tests/conftest.py (apuntando a src/).
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# scripts/ es legacy en resolución (issue #79/D2).
extend-exclude = ["scripts"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# Las deps de terceros no se instalan en el env efímero del gate.
unresolved-import = "ignore"

[tool.vulture]
min_confidence = 80

[tool.deptry]
known_first_party = ["market_data_mcp"]

[tool.deptry.per_rule_ignores]
# MetaTrader5 se importa de forma perezosa y solo existe en la máquina del director.
DEP001 = ["MetaTrader5"]
# Herramientas de dev (no se importan; son CLI del gate).
# playwright (#109): extra opcional "stories", se usa en scripts/story_render.py
# (fuera del scan `deptry src/`), por eso figura como no usada en el codebase.
DEP002 = ["ruff", "ty", "pytest", "numpy", "playwright"]
