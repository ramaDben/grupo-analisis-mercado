document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

splay: block !important; }\n  #gi-print-root .gi-print-sheet { width: 794px; height: 1123px; overflow: hidden; position: relative; page-break-after: always; break-after: page; }\n  #gi-print-root .gi-print-sheet:last-child { page-break-after: auto; break-after: auto; }\n  #gi-print-root .gi-print-sheet > * { transform: none !important; }\n}\n<\u002Fstyle>\n<script src=\"f1563ee1-0107-4723-9047-1d6f3c376c1d\"><\u002Fscript>\n<script src=\"b601346b-b239-4951-a437-0492dafacf59\"><\u002Fscript>\n<script src=\"1490ea5f-1291-41b1-8257-943c40e25b00\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;width:100%;display:flex;flex-direction:column;background:#EDEDED;font-family:'DM Sans',sans-serif;overflow:hidden;\">\n\n  <div style=\"height:52px;flex-shrink:0;background:#0D0D1A;display:flex;align-items:center;gap:16px;padding:0 16px;box-sizing:border-box;\">\n    <button sc-camel-on-click=\"{{ toggleSidebar }}\" style=\"width:32px;height:32px;border:none;background:transparent;cursor:pointer;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;\" style-hover=\"background:#1A1A2E;\">\n      <span style=\"width:16px;height:2px;background:#FFFFFF;display:block;\"><\u002Fspan>\n      <span style=\"width:16px;height:2px;background:#FFFFFF;display:block;\"><\u002Fspan>\n      <span style=\"width:16px;height:2px;background:#FFFFFF;display:block;\"><\u002Fspan>\n    <\u002Fbutton>\n    <span style=\"font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#FFFFFF;\">Grupo Inteligencia<\u002Fspan>\n    <span style=\"width:1px;height:18px;background:rgba(255,255,255,0.2);\"><\u002Fspan>\n    <span style=\"font-family:'DM Sans',sans-serif;font-size:11px;color:#8A8A94;\">Editor de Documentos Financieros<\u002Fspan>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <span style=\"font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:0.05em;color:#8A8A94;text-transform:uppercase;\">{{ pageCount }} páginas<\u002Fspan>\n    <div style=\"display:flex;align-items:center;gap:2px;background:#1A1A2E;border-radius:3px;padding:3px;\">\n      <button sc-camel-on-click=\"{{ setZoomDown }}\" style=\"width:24px;height:24px;border:none;background:transparent;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border-radius:2px;\" style-hover=\"background:#3A3F52;\">–<\u002Fbutton>\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:10.5px;color:#FFFFFF;width:42px;text-align:center;\">{{ zoomPct }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ setZoomUp }}\" style=\"width:24px;height:24px;border:none;background:transparent;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border-radius:2px;\" style-hover=\"background:#3A3F52;\">+<\u002Fbutton>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ exportPdf }}\" style=\"padding:6px 12px;border:none;background:#3E91AF;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;\" style-hover=\"background:#53C1AB;\">Exportar PDF<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;min-height:0;\">\n\n    <sc-if value=\"{{ sidebarOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:250px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E2E2E2;overflow-y:auto;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;\">\n\n        <div>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#3E91AF;display:block;margin-bottom:8px;\">Datos y Análisis<\u002Fspan>\n          <div style=\"border:1px solid #E2E2E2;border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:8px;\">\n            <span style=\"font-family:'DM Sans',sans-serif;font-size:8.5px;color:#737373;\">Importa .docx, .pdf, .xlsx, .pptx, .txt o .csv — o pega texto libre. Para indicadores: Nombre, Actual, Anterior, Forecast, Unidad<\u002Fspan>\n            <input type=\"file\" accept=\".txt,.csv,.pdf,.docx,.pptx,.xlsx\" sc-camel-on-change=\"{{ dataInput.onFileSelect }}\" style=\"font-family:'DM Sans',sans-serif;font-size:8.5px;\">\n            <sc-if value=\"{{ dataInput.fileProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-size:8px;color:#737373;\">Procesando {{ dataInput.fileProcessing }}…<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dataInput.lastImportedFile }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-size:8px;color:#3E91AF;\">Importado: {{ dataInput.lastImportedFile }} — texto extraído y agregado al cuadro (revisa antes de analizar)<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dataInput.unsupportedFile }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:8.5px;color:#C62E2E;line-height:1.5;\">{{ dataInput.unsupportedFile }}<\u002Fspan>\n            <\u002Fsc-if>\n            <textarea value=\"{{ dataInput.text }}\" sc-camel-on-change=\"{{ dataInput.onTextChange }}\" placeholder=\"ÍNDICE A, 4520, 4480, 4600, ...\" style=\"width:100%;height:60px;box-sizing:border-box;padding:6px;border:1px solid #E2E2E2;border-radius:2px;font-family:'Space Grotesk',sans-serif;font-size:9px;resize:vertical;\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:6px;\">\n              <button sc-camel-on-click=\"{{ dataInput.onAnalyze }}\" style=\"flex:1;padding:6px;border:1px solid #3E91AF;background:#FFFFFF;color:#3E91AF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;\">Analizar indicadores<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ dataInput.onAnalyzeDocument }}\" style=\"flex:1;padding:6px;border:1px solid #3E91AF;background:#FFFFFF;color:#3E91AF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;\">Analizar como documento<\u002Fbutton>\n            <\u002Fdiv>\n            <span style=\"font-family:'DM Sans',sans-serif;font-size:8px;color:#8A8A94;line-height:1.5;\">\"Analizar indicadores\" busca pares Nombre/valor para actualizar KPIs. \"Analizar como documento\" estructura el texto pegado en secciones, párrafos y tablas (columnas separadas por tabulaciones).<\u002Fspan>\n            <sc-if value=\"{{ dataInput.importWarning }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:2px solid #E84040;background:#E840400D;padding:8px;display:flex;flex-direction:column;gap:3px;\">\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#C62E2E;\">Revisión requerida antes de importar<\u002Fspan>\n                <span style=\"font-family:'DM Sans',sans-serif;font-size:8.5px;color:#0D0D1A;line-height:1.55;\">{{ dataInput.importWarning }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dataInput.importInfo }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:8px;color:#8A8A94;line-height:1.5;\">{{ dataInput.importInfo }}<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dataInput.hasStructure }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#E8F5F0;border-radius:2px;padding:8px;display:flex;flex-direction:column;gap:6px;\">\n                <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;line-height:1.5;\">Estructura del documento importada: {{ dataInput.structureSummary }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ dataInput.onPreview }}\" style=\"padding:7px;border:none;background:#0D0D1A;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:700;cursor:pointer;\">Previsualizar cambios<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ dataInput.pending }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#F7F7F7;border-radius:2px;padding:8px;display:flex;flex-direction:column;gap:6px;\">\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#3E91AF;\">Cambios detectados<\u002Fspan>\n                <sc-if value=\"{{ dataInput.emptyParse }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#C62E2E;line-height:1.5;\">No se detectaron pares indicador/valor. Usa el formato <strong>Nombre, Actual, Anterior<\u002Fstrong> (una línea por indicador) o <strong>Nombre: 2.7%<\u002Fstrong>. No se inventará ningún dato.<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ dataInput.noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#3A3F52;line-height:1.5;\">Ningún indicador coincide con las etiquetas de los KPI existentes. Puedes insertarlos como KPI nuevos o renombrar el KPI del documento para que coincida.<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ dataInput.pending }}\" as=\"pi\" hint-placeholder-count=\"2\">\n                  <div style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;line-height:1.5;border-bottom:1px solid #E2E2E2;padding-bottom:5px;\">\n                    <strong>{{ pi.name }}<\u002Fstrong> · Actual: {{ pi.current }} · Anterior: {{ pi.previous }}<br>\n                    <span style=\"color:#3E91AF;\">✓ {{ pi.matchCount }} KPI coincidente(s)<\u002Fspan> <span style=\"color:#C62E2E;\">⚠ {{ pi.lockedCount }} con edición manual (no se sobrescribirá)<\u002Fspan>\n                    <sc-if value=\"{{ pi.canInsert }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ pi.onInsert }}\" style=\"display:block;margin-top:4px;padding:3px 8px;border:1px solid #3E91AF;background:#FFFFFF;color:#3E91AF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:8.5px;cursor:pointer;\">Insertar como KPI nuevo<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ dataInput.onPreview }}\" style=\"padding:7px;border:none;background:#0D0D1A;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:700;cursor:pointer;\">Previsualizar cambios<\u002Fbutton>\n                <div style=\"display:flex;gap:6px;\">\n                  <button sc-camel-on-click=\"{{ dataInput.onApply }}\" style=\"flex:1;padding:6px;border:none;background:#3E91AF;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;\">Aplicar directo<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ dataInput.onCancel }}\" style=\"flex:1;padding:6px;border:1px solid #E2E2E2;background:#FAFAFA;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;cursor:pointer;\">Cancelar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n              <button sc-camel-on-click=\"{{ dataInput.onSaveVersion }}\" style=\"flex:1;padding:5px 6px;border:1px solid #E2E2E2;background:#FAFAFA;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:8.5px;cursor:pointer;\">Guardar versión<\u002Fbutton>\n              <sc-if value=\"{{ dataInput.hasSavedVersion }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ dataInput.onRestoreVersion }}\" style=\"flex:1;padding:5px 6px;border:1px solid #E2E2E2;background:#FAFAFA;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:8.5px;cursor:pointer;\">Restaurar versión<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dataInput.canUndo }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ dataInput.onUndo }}\" style=\"flex:1;padding:5px 6px;border:1px solid #E2E2E2;background:#FAFAFA;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:8.5px;cursor:pointer;\">Deshacer última<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dataInput.pending }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ dataInput.onApply }}\" style=\"flex:1;padding:5px 6px;border:none;background:#3E91AF;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:8.5px;font-weight:600;cursor:pointer;\">Aplicar cambios<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#3E91AF;\">Motor de Datos<\u002Fspan>\n            <label style=\"display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;font-size:8.5px;color:#3A3F52;\"><input type=\"checkbox\" checked=\"{{ dataEngine.advancedMode }}\" sc-camel-on-change=\"{{ dataEngine.onToggleAdvanced }}\">Avanzado<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E2E2E2;border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:10px;\">\n\n            <div>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Sincronización<\u002Fspan>\n              <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9.5px;color:#0D0D1A;\"><input type=\"radio\" name=\"syncmode\" checked=\"{{ dataEngine.isAuto }}\" sc-camel-on-change=\"{{ dataEngine.onSyncAuto }}\">Automática (tiempo real)<\u002Flabel>\n              <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9.5px;color:#0D0D1A;\"><input type=\"radio\" name=\"syncmode\" checked=\"{{ dataEngine.isManual }}\" sc-camel-on-change=\"{{ dataEngine.onSyncManual }}\">Manual<\u002Flabel>\n              <button sc-camel-on-click=\"{{ dataEngine.onApplyUpdate }}\" style=\"width:100%;margin-top:6px;padding:6px;border:1px solid #3E91AF;background:#3E91AF;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;\">Actualizar datos<\u002Fbutton>\n              <span style=\"display:block;margin-top:4px;font-family:'Space Grotesk',sans-serif;font-size:8px;color:#737373;\">Última sincronización: {{ dataEngine.lastUpdatedLabel }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Recálculo automático<\u002Fspan>\n              <sc-for list=\"{{ dataEngine.recalcItems }}\" as=\"ri\" hint-placeholder-count=\"8\">\n                <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;\"><input type=\"checkbox\" checked=\"{{ ri.checked }}\" sc-camel-on-change=\"{{ ri.onToggle }}\">{{ ri.label }}<\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Actualización visual<\u002Fspan>\n              <sc-for list=\"{{ dataEngine.visualItems }}\" as=\"vi\" hint-placeholder-count=\"7\">\n                <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;\"><input type=\"checkbox\" checked=\"{{ vi.checked }}\" sc-camel-on-change=\"{{ vi.onToggle }}\">{{ vi.label }}<\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Escalas<\u002Fspan>\n              <sc-for list=\"{{ dataEngine.scaleOptions }}\" as=\"so\" hint-placeholder-count=\"5\">\n                <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;\"><input type=\"radio\" name=\"scale\" checked=\"{{ so.checked }}\" sc-camel-on-change=\"{{ so.onSelect }}\">{{ so.label }}<\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Ordenamiento<\u002Fspan>\n              <sc-for list=\"{{ dataEngine.sortOptions }}\" as=\"sto\" hint-placeholder-count=\"4\">\n                <label style=\"display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:9px;color:#0D0D1A;\"><input type=\"radio\" name=\"sortmode\" checked=\"{{ sto.checked }}\" sc-camel-on-change=\"{{ sto.onSelect }}\">{{ sto.label }}<\u002Flabel>\n              <\u002Fsc-for>\n              <span style=\"display:block;margin-top:3px;font-family:'DM Sans',sans-serif;font-size:8px;color:#737373;\">Activa \"Reordenar categorías\" arriba para aplicar el orden.<\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ dataEngine.advancedMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Frecuencia de actualización automática<\u002Fspan>\n                <sc-raw-select sc-camel-on-change=\"{{ dataEngine.onRefreshChange }}\" value=\"{{ dataEngine.refreshSeconds }}\" style=\"width:100%;padding:5px;border:1px solid #E2E2E2;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9.5px;\">\n                  <option value=\"10\">Cada 10s<\u002Foption>\n                  <option value=\"30\">Cada 30s<\u002Foption>\n                  <option value=\"60\">Cada 60s<\u002Foption>\n                  <option value=\"300\">Cada 5 min<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n\n              <div>\n                <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;display:block;margin-bottom:4px;\">Fórmulas<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <sc-for list=\"{{ dataEngine.formulas }}\" as=\"fm\" hint-placeholder-count=\"2\">\n                    <div style=\"border:1px solid #E2E2E2;border-radius:2px;padding:6px;display:flex;flex-direction:column;gap:4px;\">\n                      <div style=\"display:flex;gap:4px;\">\n                        <input type=\"text\" value=\"{{ fm.name }}\" sc-camel-on-change=\"{{ fm.onNameChange }}\" style=\"flex:1;min-width:0;padding:4px;border:1px solid #E2E2E2;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:9px;\">\n                        <button sc-camel-on-click=\"{{ fm.onRemove }}\" style=\"border:none;background:transparent;color:#C62E2E;font-size:9px;cursor:pointer;\">✕<\u002Fbutton>\n                      <\u002Fdiv>\n                      <input type=\"text\" value=\"{{ fm.expr }}\" sc-camel-on-change=\"{{ fm.onExprChange }}\" style=\"padding:4px;border:1px solid #E2E2E2;border-radius:2px;font-family:'Space Grotesk',sans-serif;font-size:9px;\">\n                      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:9.5px;font-weight:700;color:#3E91AF;\">= {{ fm.result }}<\u002Fspan>\n structTotal }} bloques. Se aplicarán todos.<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <sc-for list=\"{{ previewModal.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid #E2E2E2;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;color:#0D0D1A;\">{{ row.label }}<\u002Fspan>\n              <sc-if value=\"{{ row.showLockedBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;color:#E84040;background:#E840401A;border-radius:20px;padding:3px 9px;\">🔒 Edición manual — no modificar automáticamente<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ row.onToggleForce }}\" style=\"border:none;background:transparent;color:#3E91AF;font-family:'DM Sans',sans-serif;font-size:9px;cursor:pointer;text-decoration:underline;\">Reemplazar de todas formas<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showForcedNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;color:#3E91AF;background:#3E91AF1A;border-radius:20px;padding:3px 9px;\">Reemplazo forzado por el usuario<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ row.onToggleForce }}\" style=\"border:none;background:transparent;color:#737373;font-family:'DM Sans',sans-serif;font-size:9px;cursor:pointer;text-decoration:underline;\">Conservar protegido<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showUnchanged }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-family:'DM Sans',sans-serif;font-size:9px;color:#737373;\">Sin cambios<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showActual }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-size:11px;color:#3A3F52;\">{{ row.oldValue }} <span style=\"color:#737373;font-size:9.5px;\">{{ row.oldDelta }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showPropuesta }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-family:'Syne',sans-serif;font-size:13px;color:#0D0D1A;font-weight:800;\">{{ row.newValue }} <span style=\"color:{{ row.deltaColor }};font-size:10px;\">{{ row.newDelta }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showCompare }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:8px;\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:10.5px;color:#737373;text-decoration:line-through;\">{{ row.oldValue }}<\u002Fspan>\n                  <span style=\"color:#3E91AF;\">→<\u002Fspan>\n                  <span style=\"font-family:'Syne',sans-serif;font-size:13px;color:#0D0D1A;font-weight:800;\">{{ row.newValue }}<\u002Fspan>\n                  <span style=\"font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;color:{{ row.deltaColor }};\">{{ row.newDelta }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <button sc-camel-on-click=\"{{ previewModal.onApply }}\" style=\"flex:1;padding:8px;border:none;background:#3E91AF;color:#FFFFFF;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;\">Aplicar cambios<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ previewModal.onKeepEditing }}\" style=\"flex:1;padding:8px;border:1px solid #E2E2E2;background:#FAFAFA;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;\">Seguir editando<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ previewModal.onCancel }}\" style=\"flex:1;padding:8px;border:1px solid #E840401A;background:#E840401A;color:#C62E2E;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;\">Cancelar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    pages: [],\n    activePageId: null,\n    selected: null,\n    drag: null,\n    resize: null,\n    sidebarOpen: true,\n    zoom: 0.82,\n    dataEngine: {\n      syncMode: 'auto',\n      refreshSeconds: 30,\n      lastUpdated: null,\n      recalc: { totales: true, porcentajes: true, promedios: true, rankings: true, posiciones: true, acumulados: true, kpis: true, variaciones: true },\n      visual: { graficos: true, tablas: true, indicadores: true, kpis: true, insights: true, leyendas: true, categorias: false },\n      appliedRecalc: { totales: true, porcentajes: true, promedios: true, rankings: true, posiciones: true, acumulados: true, kpis: true, variaciones: true },\n      appliedVisual: { graficos: true, tablas: true, indicadores: true, kpis: true, insights: true, leyendas: true, categorias: false },\n      scale: 'auto',\n      sort: 'original',\n      advancedMode: false,\n      formulas: [{ name: 'Total', expr: '=SUM(120,340,90)' }, { name: 'Variación %', expr: '=(340-310)/310' }],\n    },\n    reportData: { indicators: [] },\n    dataInputText: '',\n    pendingIndicators: null,\n    savedVersion: null,\n    historyStack: [],\n    previewOpen: false,\n    previewMode: 'comparar',\n    previewOverrides: {},\n    importedStructure: null,\n  };\n\n  componentDidMount() {\n    const p1 = this.buildPage('portada', 'p1');\n    const p2 = this.buildPage('apertura', 'p2');\n    const p3 = this.buildPage('dashboard', 'p3');\n    this.setState({ pages: [p1, p2, p3], activePageId: 'p2' });\n    this._onMove = (e) => this.handlePointerMove(e);\n    this._onUp = () => this.handlePointerUp();\n    window.addEventListener('mousemove', this._onMove);\n    window.addEventListener('mouseup', this._onUp);\n    this.startSyncTimer();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('mousemove', this._onMove);\n    window.removeEventListener('mouseup', this._onUp);\n    this.stopSyncTimer();\n  }\n\n  startSyncTimer() {\n    this.stopSyncTimer();\n    this._syncTimer = setInterval(() => {\n      if (this.state.dataEngine.syncMode === 'auto') this.applyDataUpdate();\n    }, Math.max(5, this.state.dataEngine.refreshSeconds) * 1000);\n  }\n  stopSyncTimer() { if (this._syncTimer) clearInterval(this._syncTimer); }\n\n  setSyncMode(mode) { this.setState((s) => ({ dataEngine: { ...s.dataEngine, syncMode: mode } })); }\n  setRefreshSeconds(v) {\n    this.setState((s) => ({ dataEngine: { ...s.dataEngine, refreshSeconds: v } }), () => this.startSyncTimer());\n  }\n  toggleRecalcFlag(key) {\n    this.setState((s) => {\n      const recalc = { ...s.dataEngine.recalc, [key]: !s.dataEngine.recalc[key] };\n      const auto = s.dataEngine.syncMode === 'auto';\n      return { dataEngine: { ...s.dataEngine, recalc, appliedRecalc: auto ? recalc : s.dataEngine.appliedRecalc } };\n    });\n  }\n  toggleVisualFlag(key) {\n    this.setState((s) => {\n      const visual = { ...s.dataEngine.visual, [key]: !s.dataEngine.visual[key] };\n      const auto = s.dataEngine.syncMode === 'auto';\n      return { dataEngine: { ...s.dataEngine, visual, appliedVisual: auto ? visual : s.dataEngine.appliedVisual } };\n    });\n  }\n  applyDataUpdate() {\n    this.setState((s) => ({\n      dataEngine: { ...s.dataEngine, appliedRecalc: { ...s.dataEngine.recalc }, appliedVisual: { ...s.dataEngine.visual }, lastUpdated: Date.now() },\n    }));\n  }\n  setScale(v) { this.setState((s) => ({ dataEngine: { ...s.dataEngine, scale: v } })); }\n  setSort(v) { this.setState((s) => ({ dataEngine: { ...s.dataEngine, sort: v } })); }\n  toggleAdvanced() { this.setState((s) => ({ dataEngine: { ...s.dataEngine, advancedMode: !s.dataEngine.advancedMode } })); }\n  addFormula() {\n    this.setState((s) => ({ dataEngine: { ...s.dataEngine, formulas: [...s.dataEngine.formulas, { name: 'Nueva fórmula', expr: '=SUM(0)' }] } }));\n  }\n  removeFormula(idx) {\n    this.setState((s) => ({ dataEngine: { ...s.dataEngine, formulas: s.dataEngine.formulas.filter((_, i) => i !== idx) } }));\n  }\n  updateFormula(idx, field, value) {\n    this.setState((s) => ({ dataEngine: { ...s.dataEngine, formulas: s.dataEngine.formulas.map((f, i) => (i === idx ? { ...f, [field]: value } : f)) } }));\n  }\n  evalFormula(expr) {\n    if (!expr) return '—';\n    let e = expr.trim().replace(/^=/, '');\n    try {\n      e = e.replace(/(SUM|AVERAGE|MAX|MIN|MEDIAN)\\(([^)]*)\\)/gi, (m, fn, args) => {\n        const nums = args.split(',').map((s) => parseFloat(s.trim())).filter((n) => !isNaN(n));\n        if (!nums.length) return '0';\n        const f = fn.toUpperCase();\n        if (f === 'SUM') return String(nums.reduce((a, b) => a + b, 0));\n        if (f === 'AVERAGE') return String(nums.reduce((a, b) => a + b, 0) / nums.length);\n        if (f === 'MAX') return String(Math.max(...nums));\n        if (f === 'MIN') return String(Math.min(...nums));\n        if (f === 'MEDIAN') { const s2 = [...nums].sort((a, b) => a - b); const mid = Math.floor(s2.length / 2); return String(s2.length % 2 ? s2[mid] : (s2[mid - 1] + s2[mid]) / 2); }\n        return '0';\n      });\n      if (!/^[0-9+\\-*/(). ]+$/.test(e)) return 'Fórmula inválida';\n      const result = Function('\"use strict\"; return (' + e + ')')();\n      return typeof result === 'number' && !isNaN(result) ? (Math.round(result * 10000) / 10000).toString() : 'Fórmula inválida';\n    } catch (err) { return 'Fórmula inválida'; }\n  }\n  sortRows(rows, mode) {\n    if (!rows || mode === 'original') return rows;\n    const arr = [...rows];\n    if (mode === 'asc') return arr.sort((a, b) => String(a.cells[0]).localeCompare(String(b.cells[0])));\n    if (mode === 'desc') return arr.sort((a, b) => String(b.cells[0]).localeCompare(String(a.cells[0])));\n    if (mode === 'auto') return arr.sort((a, b) => {\n      const na = parseFloat(String(a.cells[a.cells.length - 1]).replace(/[^0-9.-]/g, ''));\n      const nb = parseFloat(String(b.cells[b.cells.length - 1]).replace(/[^0-9.-]/g, ''));\n      if (!isNaN(na) && !isNaN(nb)) return nb - na;\n      return String(a.cells[0]).localeCompare(String(b.cells[0]));\n    });\n    return arr;\n  }\n  computeAffected() {\n    const counts = { chart: 0, table: 0, kpi: 0, alert: 0, callout: 0 };\n    this.state.pages.forEach((p) => p.blocks.forEach((b) => { if (counts[b.kind] !== undefined) counts[b.kind]++; }));\n    const de = this.state.dataEngine;\n    const visMap = { graficos: 'chart', tablas: 'table', kpis: 'kpi', indicadores: 'alert', insights: 'callout' };\n    let affected = 0;\n    Object.keys(visMap).forEach((k) => { if (de.visual[k] !== de.appliedVisual[k]) affected += counts[visMap[k]]; });\n    const recalcChanged = Object.keys(de.recalc).some((k) => de.recalc[k] !== de.appliedRecalc[k]);\n    if (recalcChanged) affected += counts.kpi;\n    return { affected, chartCount: counts.chart, tableCount: counts.table, kpiCount: counts.kpi, formulaCount: de.formulas.length, pending: de.syncMode === 'manual' && (affected > 0) };\n  }\n\n  normalizeKey(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }\n  setDataInputText(v) { this.setState({ dataInputText: v }); }\n  onFileSelected(ev) {\n    const file = ev.target.files && ev.target.files[0];\n    if (!file) return;\n    const ext = file.name.split('.').pop().toLowerCase();\n    ev.target.value = '';\n    if (ext === 'txt' || ext === 'csv') {\n      const reader = new FileReader();\n      reader.onload = () => {\n        const text = String(reader.result || '');\n        this.setState((s) => ({ dataInputText: (s.dataInputText ? s.dataInputText + '\\n' : '') + text, lastImportedFile: file.name, unsupportedFile: null }));\n      };\n      reader.readAsText(file);\n      return;\n    }\n    if (!['pdf', 'docx', 'pptx', 'xlsx'].includes(ext)) {\n      this.setState({ unsupportedFile: file.name + ' — formato no soportado.', lastImportedFile: null });\n      return;\n    }\n    this.setState({ fileProcessing: file.name, unsupportedFile: null, importWarning: '', importInfo: '' });\n    this.processFile(file, ext).then((res) => {\n      const structure = (res && res.structure) || [];\n      const clean = ((res && res.text) || '').trim();\n      if (!clean && !structure.length) {\n        this.setState({ fileProcessing: null, unsupportedFile: file.name + ' — no se encontró texto seleccionable (posible documento escaneado o basado en imágenes). OCR no disponible en este entorno. Revisión manual requerida: pega el contenido manualmente.' });\n        return;\n      }\n      this.setState((s) => ({ dataInputText: (s.dataInputText ? s.dataInputText + '\\n' : '') + clean, lastImportedFile: file.name, fileProcessing: null, importedStructure: structure.length ? structure : null, importWarning: (res && res.warning) || '', importInfo: (res && res.info) || '' }));\n    }).catch((err) => {\n      this.setState({ fileProcessing: null, unsupportedFile: file.name + ' — error al leer el archivo (' + (err && err.message ? err.message : 'formato inválido') + '). Pega el contenido manualmente.' });\n    });\n  }\n\n  async processFile(file, ext) {\n    con
